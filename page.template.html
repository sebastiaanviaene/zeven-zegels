<title>Zeven Zegels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,400;0,600;0,700;1,500&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&family=Space+Mono:wght@400;700&display=swap">

<style>
:root {
  --paper:   #FFFCF3;
  --paper-2: #F6F0E1;
  --ink:     #2C2A26;
  --ink-2:   #7A7466;
  --teal:    #0E9B93;
  --teal-lt: #C9E9E5;
  --coral:   #FF6A57;
  --coral-lt:#FFDDD6;
  --sun:     #FFC93C;
  --moss:    #9DC08B;
  --moss-lt: #D8E7CD;
  --water:   #9AD1DA;
  --stone:   #CFC7B4;

  --hand: "Shantell Sans", "Comic Sans MS", cursive;
  --body: "Nunito", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html { background: var(--paper-2); }

body {
  margin: 0;
  background: var(--paper-2);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.sheet {
  max-width: 60rem;
  margin: 0 auto;
  padding: clamp(1rem, 4vw, 2.5rem) clamp(0.75rem, 3vw, 2rem) 4rem;
}

/* ---------------- header ---------------- */

header { text-align: center; margin-bottom: 1.1rem; }

h1 {
  font-family: var(--hand);
  font-weight: 700;
  font-size: clamp(2.3rem, 9vw, 3.6rem);
  line-height: 1;
  margin: 0;
  color: var(--ink);
  transform: rotate(-1.4deg);
}

h1 span { color: var(--coral); display: inline-block; transform: rotate(2deg); }

.sub {
  font-family: var(--hand);
  font-size: clamp(0.95rem, 2.6vw, 1.15rem);
  color: var(--ink-2);
  margin: 0.45rem 0 0;
}

.tally {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  margin-top: 0.9rem;
  padding: 0.35rem 0.9rem;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 999px;
  box-shadow: 3px 3px 0 var(--ink);
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 700;
  transform: rotate(0.8deg);
}

.dots { display: flex; gap: 4px; }

.dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--paper-2);
  border: 1.5px solid var(--ink);
  transition: background 220ms ease;
}

.dot.on { background: var(--coral); }

/* ---------------- map ---------------- */

.viewport {
  position: relative;
  overflow: hidden;
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 6px;
  box-shadow: 6px 6px 0 var(--ink);
  aspect-ratio: 1000 / 620;
  touch-action: none;
  cursor: grab;
  -webkit-user-select: none;
  user-select: none;
}

.viewport.dragging { cursor: grabbing; }

.world {
  position: absolute;
  top: 0; left: 0;
  width: 1000px;
  height: 620px;
  transform-origin: 0 0;
  will-change: transform;
}

.world > svg { display: block; width: 1000px; height: 620px; }

.zoomctl {
  position: absolute;
  left: 10px;
  bottom: 10px;
  z-index: 4;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.zoomctl button {
  width: 38px; height: 38px;
  font-family: var(--mono);
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1;
  color: var(--ink);
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 6px;
  box-shadow: 2px 2px 0 var(--ink);
  cursor: pointer;
  padding: 0;
}

.zoomctl button:active { transform: translate(2px, 2px); box-shadow: none; }
.zoomctl button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.hint {
  text-align: center;
  font-family: var(--hand);
  color: var(--ink-2);
  font-size: 0.9rem;
  margin: 0.8rem 0 0;
}

/* pins */

.pin {
  position: absolute;
  transform: translate(-50%, -50%) scale(var(--inv, 1));
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 3px solid var(--ink);
  background: var(--stone);
  color: var(--ink);
  font-family: var(--mono);
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  padding: 0;
  box-shadow: 2px 3px 0 var(--ink);
  transition: background 220ms ease;
}

.pin:hover { background: var(--sun); }
.pin.far { opacity: 0.42; }
.pin.next { background: var(--sun); box-shadow: 0 0 0 4px var(--sun), 2px 3px 0 var(--ink); }
.pin:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.pin.done { background: var(--coral); color: var(--paper); }

.pin .lock { font-size: 1.05rem; line-height: 1; }

.pin-label {
  position: absolute;
  left: 50%;
  top: calc(100% + 5px);
  transform: translateX(-50%);
  font-family: var(--hand);
  font-size: 0.72rem;
  font-weight: 600;
  white-space: nowrap;
  color: var(--ink);
  background: var(--paper);
  padding: 0 4px;
  border-radius: 3px;
  pointer-events: none;
}

/* ---------------- note dialog ---------------- */

dialog.note {
  width: min(34rem, 92vw);
  border: 3px solid var(--ink);
  border-radius: 6px;
  background: var(--paper);
  color: var(--ink);
  padding: 0;
  box-shadow: 7px 7px 0 var(--ink);
}

dialog.note::backdrop { background: rgba(44, 42, 38, 0.55); }

.note-inner { padding: clamp(1.1rem, 4vw, 1.8rem); }

.tape {
  height: 20px;
  background: repeating-linear-gradient(45deg, var(--sun) 0 9px, #FFDC7A 9px 18px);
  border-bottom: 3px solid var(--ink);
}

.note h2 {
  font-family: var(--hand);
  font-weight: 700;
  font-size: clamp(1.5rem, 5vw, 2rem);
  line-height: 1.05;
  margin: 0.2rem 0 0;
  text-wrap: balance;
}

.stamp {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--teal);
  border: 2px solid var(--teal);
  border-radius: 3px;
  padding: 0.1rem 0.45rem;
  transform: rotate(-2deg);
}

.note p { margin: 0.85rem 0 0; }
.note p:first-of-type { margin-top: 0.9rem; }

.note strong { font-weight: 800; }

.note ul { margin: 0.85rem 0 0; padding-left: 1.15rem; }
.note li { margin-top: 0.35rem; }
.note li::marker { color: var(--coral); }

.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin: 1rem 0 0;
  padding: 0;
}

.facts div {
  background: var(--teal-lt);
  border: 2px solid var(--ink);
  border-radius: 4px;
  padding: 0.3rem 0.6rem;
  font-family: var(--mono);
  font-size: 0.76rem;
  font-weight: 700;
}

.facts span { color: var(--ink-2); font-weight: 400; }

.aside {
  margin: 1rem 0 0;
  background: var(--coral-lt);
  border: 2px dashed var(--coral);
  border-radius: 4px;
  padding: 0.7rem 0.9rem;
  font-size: 0.93rem;
}

.aside b {
  display: block;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--coral);
  margin-bottom: 0.2rem;
}

.kiss {
  font-family: var(--hand);
  font-size: 1.2rem;
  color: var(--coral);
  margin-top: 1rem;
  transform: rotate(-1deg);
}

/* keypad */

.keypad { display: flex; gap: 0.5rem; margin-top: 1.1rem; flex-wrap: wrap; }

.keypad input {
  flex: 1 1 9rem;
  min-width: 0;
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-align: center;
  padding: 0.6rem 0.7rem;
  color: var(--ink);
  background: var(--paper-2);
  border: 2px solid var(--ink);
  border-radius: 4px;
}

.keypad input::placeholder { color: var(--ink-2); font-weight: 400; letter-spacing: 0.14em; }
.keypad input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.keypad button {
  font-family: var(--hand);
  font-size: 1rem;
  font-weight: 700;
  padding: 0.55rem 1.2rem;
  color: var(--paper);
  background: var(--coral);
  border: 2px solid var(--ink);
  border-radius: 4px;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
}

.keypad button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.keypad button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.deny {
  font-family: var(--hand);
  color: var(--coral);
  font-size: 0.95rem;
  margin: 0.6rem 0 0;
}

.close {
  margin-top: 1.3rem;
  font-family: var(--hand);
  font-size: 0.92rem;
  background: none;
  border: 2px solid var(--ink);
  border-radius: 4px;
  padding: 0.35rem 0.9rem;
  cursor: pointer;
  color: var(--ink);
}

.close:hover { background: var(--paper-2); }
.close:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.shake { animation: shake 380ms ease; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

.pop { animation: pop 420ms cubic-bezier(0.2,0.8,0.3,1.2); }
@keyframes pop {
  from { opacity: 0; transform: scale(0.96) rotate(-1deg); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .shake, .pop { animation: none; }
  .pin { transition: none; }
}

/* ---------------- quick list (small screens) ---------------- */

.quicklist {
  display: none;
  flex-wrap: wrap;
  gap: 0.45rem;
  justify-content: center;
  margin-top: 0.9rem;
}

.quicklist button {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-family: var(--hand);
  font-size: 0.88rem;
  padding: 0.35rem 0.7rem;
  background: var(--paper);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 999px;
  box-shadow: 2px 2px 0 var(--ink);
  cursor: pointer;
}

.quicklist button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.quicklist button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.quicklist button.done { background: var(--coral); color: var(--paper); }

.quicklist .qn {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
}

.quicklist button.far { opacity: 0.45; }
.quicklist button.next { background: var(--sun); }

.notyet {
  font-family: var(--hand);
  font-size: 1.02rem;
  color: var(--ink-2);
  margin-top: 0.9rem;
}

.forceer {
  margin-top: 0.9rem;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-2);
  background: none;
  border: 1px dashed var(--stone);
  border-radius: 4px;
  padding: 0.3rem 0.65rem;
  cursor: pointer;
}

.forceer:hover { color: var(--ink); border-color: var(--ink); }
.forceer:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

.adminbar {
  display: flex;
  gap: 0.4rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 0.6rem;
}

/* ---------------- the gate ---------------- */

/* while sealed, the card is the only thing on the page */

body.sealed .sheet {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding-top: 1rem;
  padding-bottom: 1rem;
}

body.sealed header,
body.sealed footer,
body.sealed .hint,
body.sealed .quicklist,
body.sealed .viewport,
.presealed header,
.presealed footer,
.presealed .hint,
.presealed .quicklist,
.presealed .viewport { display: none; }

.presealed .sheet {
  min-height: 100dvh;
  display: grid;
  place-items: center;
}

body.sealed .gate { max-width: 30rem; }

.gate {
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 6px;
  box-shadow: 6px 6px 0 var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.8rem;
  padding: clamp(1.5rem, 6vw, 2.6rem) clamp(1rem, 5vw, 2rem);
  text-align: center;
}

.gate .seal-blob {
  width: 76px; height: 76px;
  border-radius: 50%;
  background: var(--coral);
  border: 3px solid var(--ink);
  box-shadow: 3px 4px 0 var(--ink);
  display: grid;
  place-items: center;
  font-size: 2rem;
  transform: rotate(-7deg);
}

.gate h2 {
  font-family: var(--hand);
  font-weight: 700;
  font-size: clamp(1.35rem, 4.5vw, 2rem);
  margin: 0;
  line-height: 1.1;
  max-width: 22ch;
  text-wrap: balance;
}

.gate .why {
  font-family: var(--hand);
  color: var(--ink-2);
  margin: 0;
  font-size: 1rem;
  max-width: 34ch;
}

.clock {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.2rem;
  flex-wrap: wrap;
  justify-content: center;
}

.clock div {
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 5px;
  box-shadow: 2px 3px 0 var(--ink);
  padding: 0.35rem 0.6rem;
  min-width: 62px;
}

.clock b {
  display: block;
  font-family: var(--mono);
  font-size: 1.35rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.clock span {
  font-family: var(--hand);
  font-size: 0.7rem;
  color: var(--ink-2);
}

.gate form {
  display: flex;
  gap: 0.4rem;
  margin-top: 0.6rem;
  flex-wrap: wrap;
  justify-content: center;
}

.gate input {
  width: 8.5rem;
  font-family: var(--mono);
  font-size: 0.8rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-align: center;
  padding: 0.4rem 0.5rem;
  color: var(--ink);
  background: var(--paper);
  border: 2px solid var(--stone);
  border-radius: 4px;
}

.gate input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.gate form button {
  font-family: var(--hand);
  font-size: 0.85rem;
  padding: 0.35rem 0.8rem;
  background: var(--paper);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 4px;
  cursor: pointer;
}

.gate form button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.gate .tiny {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin: 0;
}

/* ---------------- the opening, first time only ---------------- */

.world.intro > svg { animation: mapin 900ms cubic-bezier(0.2, 0.8, 0.25, 1) both; }

@keyframes mapin {
  from { opacity: 0; filter: blur(3px); }
  to { opacity: 1; filter: none; }
}

.pin.popin {
  animation: popin 620ms cubic-bezier(0.2, 0.9, 0.3, 1.5) both;
  animation-delay: var(--d, 0ms);
}

@keyframes popin {
  from { opacity: 0; transform: translate(-50%, -190%) scale(var(--inv, 1)); }
  60%  { opacity: 1; }
  to   { opacity: 1; transform: translate(-50%, -50%) scale(var(--inv, 1)); }
}

/* ---------------- the opening ceremony ---------------- */

.bigbtn {
  font-family: var(--hand);
  font-size: clamp(1.1rem, 4vw, 1.4rem);
  font-weight: 700;
  padding: 0.7rem 1.6rem;
  color: var(--paper);
  background: var(--coral);
  border: 3px solid var(--ink);
  border-radius: 6px;
  box-shadow: 4px 5px 0 var(--ink);
  cursor: pointer;
  animation: nudge 2.6s ease-in-out infinite;
}

.bigbtn:active { transform: translate(3px, 4px); box-shadow: 1px 1px 0 var(--ink); }
.bigbtn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

@keyframes nudge {
  0%, 92%, 100% { transform: none; }
  95% { transform: rotate(-2deg) scale(1.03); }
  98% { transform: rotate(2deg) scale(1.03); }
}

.seq {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  min-height: 9.5rem;
  justify-content: center;
}

.seq p {
  font-family: var(--hand);
  font-size: clamp(1.05rem, 4vw, 1.35rem);
  line-height: 1.35;
  margin: 0;
  max-width: 26ch;
  opacity: 0;
  animation: linein 700ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
}

.seq p.last { color: var(--coral); font-weight: 700; }

@keyframes linein {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

.gate.shaking .seal-blob { animation: crack 700ms ease-in-out; }

@keyframes crack {
  0% { transform: rotate(-7deg) scale(1); }
  25% { transform: rotate(6deg) scale(1.12); }
  50% { transform: rotate(-9deg) scale(1.15); }
  75% { transform: rotate(5deg) scale(1.1); }
  100% { transform: rotate(-7deg) scale(1); }
}

.gate.fading { animation: gateout 620ms ease forwards; }

@keyframes gateout {
  to { opacity: 0; transform: scale(0.97); }
}

.confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99;
  overflow: hidden;
}

.confetti i {
  position: absolute;
  top: -14px;
  width: 9px;
  height: 14px;
  border-radius: 1px;
  animation: fall linear forwards;
}

@keyframes fall {
  from { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  to { transform: translateY(105vh) rotate(760deg); opacity: 0.9; }
}

@media (prefers-reduced-motion: reduce) {
  .world.intro > svg, .pin.popin { animation: none; }
  .heart { animation: none; }
  .confetti { display: none; }
}

/* ---------------- plan sheet ---------------- */

dialog.plan {
  width: min(52rem, 94vw);
  max-height: 88vh;
  border: 3px solid var(--ink);
  border-radius: 6px;
  background: var(--paper);
  color: var(--ink);
  padding: 0;
  box-shadow: 7px 7px 0 var(--ink);
  overflow: hidden;
}

dialog.plan::backdrop { background: rgba(44, 42, 38, 0.6); }

.plan-bar {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 1rem;
  background: var(--sun);
  border-bottom: 3px solid var(--ink);
}

.plan-bar strong {
  font-family: var(--hand);
  font-size: 1.05rem;
  font-weight: 700;
}

.plan-bar button {
  margin-left: auto;
  font-family: var(--hand);
  font-size: 0.9rem;
  padding: 0.25rem 0.75rem;
  background: var(--paper);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 4px;
  cursor: pointer;
}

.plan-bar button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.plan-body {
  overflow-y: auto;
  max-height: calc(88vh - 3.2rem);
  padding: 1.1rem clamp(1rem, 3vw, 1.9rem) 2rem;
  overscroll-behavior: contain;
  font-size: 0.95rem;
}

.plan-body h1 {
  font-family: var(--hand);
  font-size: 1.7rem;
  line-height: 1.1;
  margin: 0 0 0.4rem;
  transform: none;
}

.plan-body h2 {
  font-family: var(--hand);
  font-size: 1.35rem;
  margin: 1.6rem 0 0.5rem;
  padding-bottom: 0.2rem;
  border-bottom: 2px solid var(--ink);
}

.plan-body h3 {
  font-family: var(--hand);
  font-size: 1.08rem;
  margin: 1.2rem 0 0.35rem;
  color: var(--teal);
}

.plan-body p { margin: 0.55rem 0; }
.plan-body strong { font-weight: 800; }
.plan-body a { color: var(--teal); }

.plan-body ul { margin: 0.5rem 0; padding-left: 1.15rem; }
.plan-body li { margin: 0.25rem 0; }
.plan-body li::marker { color: var(--coral); }

.plan-body hr {
  border: none;
  border-top: 2px dashed var(--stone);
  margin: 1.6rem 0;
}

.plan-body .tablewrap { overflow-x: auto; margin: 0.7rem 0; }

.plan-body table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.9rem;
}

.plan-body th, .plan-body td {
  border: 1px solid var(--stone);
  padding: 0.35rem 0.55rem;
  text-align: left;
  vertical-align: top;
}

.plan-body th { background: var(--teal-lt); font-weight: 800; }
.plan-body tr:nth-child(even) td { background: var(--paper-2); }
.plan-body td:first-child { white-space: nowrap; }

@media (max-width: 560px) {
  dialog.plan {
    width: 100%;
    max-width: 100%;
    max-height: 92vh;
    position: fixed;
    inset: auto 0 0 0;
    border-width: 3px 0 0;
    border-radius: 14px 14px 0 0;

        'niemand dat terras inkijken.</p>' +
        '<div class="facts"><div>eigen <span>ingang</span></div><div>eigen <span>keuken</span></div><div>eigen <span>terras</span></div></div>' +
        '<p>Wandelpaden beginnen letterlijk rond het huis. En er staan tuinstoelen, precies op het moment dat ' +
        'de zon laag komt te staan.</p>' +

    },
    {
      n: "6", hash: 204049865, x: 62, y: 84, label: "eten",
      when: "Zaterdag &middot; 19:00",
      title: "Aan tafel",
      teaser: "Een dag als deze verdient koolhydraten.",
      body:
        '<p>Beneden in het dorp staat <strong>Trattoria Vulcano</strong>. Geen sterren, geen tasting menu, geen ' +
        'amuse die je met een pincet moet eten. Gewoon een Italiaan in een Eifeldorp van dertienhonderd ' +
        'inwoners, met pasta en een fles rood.</p>' +
        '<div class="facts"><div>1,3 km <span>bergaf</span></div><div>21:30 <span>keuken dicht</span></div></div>' +
        '<p>Zelfde straat als waar we vanochtend vertrokken zijn. Dezelfde stoep, een hele dag later.</p>' +
        '<p class="kiss">Op jou.</p>'
    },
    {
      n: "7", hash: 1132313756, x: 86, y: 26, label: "zondag",
      when: "Zondag",
      title: "Het laatste zegel",
      teaser: "Eén keuze, en die is aan jou.",
      body:
        '<p>Uitchecken moet tussen tien en half elf. Daarna ligt er nog één dag, en jij kiest wat we ermee doen. ' +
        'Alle drie zijn goed, en het is er één.</p>' +
        '<ul>' +
        '<li><strong>De burchten</strong>, als we die gisteren hebben laten liggen. Vijf kilometer vanaf ' +
        'dezelfde parking, met een uitzichtpunt waar je beide ruïnes tegelijk ziet. De binnenkant van de ' +
        'onderste burcht kan vanaf elf uur.</li>' +
        '<li><strong>De meren.</strong> Achtenhalve kilometer rond drie kratermeren, met bovenop een ' +
        'uitkijktoren van elf meter en drieënveertig treden. Gratis, altijd open, en je ziet alle drie de ' +
        'meren in één blik.</li>' +
        '<li><strong>De thermen.</strong> Warm water en helemaal niks doen, na twee dagen op je benen. ' +
        'De enige Glauberzout-thermen van Duitsland, en open tot tien uur \'s avonds. Wel een echte omweg.</li>' +
        '</ul>' +
        '<div class="aside"><b>En dan</b>Tweeënhalf uur terug naar huis. Dat was het weekend.</div>' +
        '<p class="kiss">Dank je dat je meeging.</p>'
    }
  ];

  var viewport = document.getElementById("viewport");
  var world = document.getElementById("world");
  var dots = document.getElementById("dots");
  var count = document.getElementById("count");
  var note = document.getElementById("note");
  var inner = document.getElementById("noteInner");
  var quicklist = document.getElementById("quicklist");

  /* ---------- pan & zoom, Google-Maps style ---------- */

  var W = 1000, H = 620;
  var k = 1, tx = 0, ty = 0;      // scale + translation of the world
  var kMin = 1, kMax = 4;
  var dragged = false;

  function apply() {
    world.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + k + ")";
    world.style.setProperty("--inv", 1 / k);
  }

  function clampPan() {
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    var mw = W * k, mh = H * k;
    // if the map is wider than the frame, keep it covering; otherwise centre it
    tx = mw >= vw ? Math.min(0, Math.max(vw - mw, tx)) : (vw - mw) / 2;
    ty = mh >= vh ? Math.min(0, Math.max(vh - mh, ty)) : (vh - mh) / 2;
  }

  function zoomTo(nk, cx, cy) {
    nk = Math.min(kMax, Math.max(kMin, nk));
    if (nk === k) return;
    // keep the point under (cx, cy) fixed
    tx = cx - (cx - tx) * (nk / k);
    ty = cy - (cy - ty) * (nk / k);
    k = nk;
    clampPan();
    apply();
  }

  function fit(cover) {
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    if (!vw || !vh) return;
    var contain = Math.min(vw / W, vh / H);
    var fill = Math.max(vw / W, vh / H);
    // in a portrait frame, zooming out to "contain" leaves ugly empty bands and
    // crowds the pins, so never let it go below the filling scale there
    kMin = cover ? fill : contain;
    kMax = kMin * 5;
    k = cover ? fill : contain;
    tx = (vw - W * k) / 2;
    ty = (vh - H * k) / 2;
    clampPan();
    apply();
  }

  var pointers = new Map();
  var startDist = 0, startK = 1, startMid = null, startTx = 0, startTy = 0, moved = 0;

  function mid() {
    var p = Array.from(pointers.values());
    return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
  }
  function dist() {
    var p = Array.from(pointers.values());
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
  function local(ev) {
    var r = viewport.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  viewport.addEventListener("pointerdown", function (ev) {
    // never capture a press aimed at a pin or a zoom button: capture retargets the
    // following click to the viewport and the button never fires
    if (ev.target.closest(".pin, .zoomctl")) return;
    pointers.set(ev.pointerId, local(ev));
    viewport.setPointerCapture(ev.pointerId);
    moved = 0;
    dragged = false;
    startTx = tx; startTy = ty; startK = k;
    if (pointers.size === 2) { startDist = dist(); startMid = mid(); }
    viewport.classList.add("dragging");
  });

  viewport.addEventListener("pointermove", function (ev) {
    if (!pointers.has(ev.pointerId)) return;
    var prev = pointers.get(ev.pointerId);
    var now = local(ev);
    pointers.set(ev.pointerId, now);

    if (pointers.size === 2) {
      var d = dist();
      if (startDist > 0) {
        var m = mid();
        var nk = Math.min(kMax, Math.max(kMin, startK * (d / startDist)));
        tx = m.x - (startMid.x - startTx) * (nk / startK);
        ty = m.y - (startMid.y - startTy) * (nk / startK);
        k = nk;
        clampPan();
        apply();
      }
      dragged = true;
      return;
    }

    var dx = now.x - prev.x, dy = now.y - prev.y;
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 6) dragged = true;
    tx += dx; ty += dy;
    clampPan();
    apply();
  });

  function endPointer(ev) {
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) startDist = 0;
    if (pointers.size === 0) {
      viewport.classList.remove("dragging");
      setTimeout(function () { dragged = false; }, 0);
    }
  }
  viewport.addEventListener("pointerup", endPointer);
  viewport.addEventListener("pointercancel", endPointer);

  viewport.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var p = local(ev);
    zoomTo(k * (ev.deltaY < 0 ? 1.18 : 1 / 1.18), p.x, p.y);
  }, { passive: false });

  viewport.addEventListener("dblclick", function (ev) {
    var p = local(ev);
    zoomTo(k * 1.7, p.x, p.y);
  });

  document.getElementById("zin").addEventListener("click", function () {
    zoomTo(k * 1.4, viewport.clientWidth / 2, viewport.clientHeight / 2);
  });
  document.getElementById("zout").addEventListener("click", function () {
    zoomTo(k / 1.4, viewport.clientWidth / 2, viewport.clientHeight / 2);
  });
  document.getElementById("zfit").addEventListener("click", function () {
    fit(window.innerWidth <= 700);
  });

  // only refit on a real width change, so the mobile URL bar hiding doesn't reset the view
  var rt = null, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(rt);
    rt = setTimeout(function () { fit(window.innerWidth <= 700); }, 150);
  });

  function hash(s) {
    var x = 5381;
    s = String(s).toLowerCase().trim();
    for (var i = 0; i < s.length; i++) { x = ((x * 33) ^ s.charCodeAt(i)) >>> 0; }
    return x;
  }

  function load() {
    try { var r = localStorage.getItem(KEY); return r ? JSON.parse(r) : []; }
    catch (e) { return []; }
  }
  function save(v) {
    try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
  }

  var open = load();
  var admin = (function () {
    try { return localStorage.getItem("zevenzegels.admin.v1") === "1"; }
    catch (e) { return false; }
  })();

  SEALS.forEach(function (s, i) {
    var b = document.createElement("button");
    b.className = "pin";
    b.type = "button";
    b.style.left = s.x + "%";
    b.style.top = s.y + "%";
    b.setAttribute("aria-label", "Plek " + s.n + ", " + s.label);
    b.innerHTML = '<span class="glyph"></span><span class="pin-label">' + s.label + "</span>";
    b.addEventListener("click", function () { if (!dragged) show(i); });
    world.appendChild(b);
    s.el = b;

    var d = document.createElement("span");
    d.className = "dot";
    dots.appendChild(d);
    s.dot = d;

    var q = document.createElement("button");
    q.type = "button";
    q.innerHTML = '<span class="qn">' + s.n + '</span><span>' + s.label + '</span>';
    q.addEventListener("click", function () { show(i); });
    quicklist.appendChild(q);
    s.chip = q;
  });

  function nextIndex() {
    for (var i = 0; i < SEALS.length; i++) {
      if (open.indexOf(i) === -1) return i;
    }
    return -1;
  }

  function paint() {
    var n = 0;
    var nx = nextIndex();
    SEALS.forEach(function (s, i) {
      var done = open.indexOf(i) !== -1;
      if (done) n++;
      var isNext = !done && i === nx;
      var far = !done && !isNext && !admin;

      s.el.classList.toggle("done", done);
      s.el.classList.toggle("next", isNext);
      s.el.classList.toggle("far", far);
      s.dot.classList.toggle("on", done);
      s.el.querySelector(".glyph").innerHTML = done
        ? s.n
        : '<span class="lock">&#128274;</span>';

      s.chip.classList.toggle("done", done);
      s.chip.classList.toggle("next", isNext);
      s.chip.classList.toggle("far", far);
      s.chip.querySelector(".qn").textContent = done ? s.n : "🔒";
    });
    count.textContent = n + "/7 open";
  }

  function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var box = document.createElement("div");
    box.className = "confetti";
    var colors = ["#FF6A57", "#FFC93C", "#0E9B93", "#9DC08B", "#FFFCF3"];
    for (var i = 0; i < 70; i++) {
      var bit = document.createElement("i");
      bit.style.left = Math.random() * 100 + "vw";
      bit.style.background = colors[i % colors.length];
      bit.style.animationDuration = (2.4 + Math.random() * 2.2) + "s";
      bit.style.animationDelay = (Math.random() * 0.9) + "s";
      box.appendChild(bit);
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 6000);
  }


  function show(i) {
    var s = SEALS[i];
    var done = open.indexOf(i) !== -1;

    if (done) {
      inner.innerHTML =
        '<span class="stamp">' + s.when + "</span>" +
        "<h2>" + s.title + "</h2>" +
        s.body +
        '<button class="close" type="button">terug naar de kaart</button>';
    } else if (!admin && i !== nextIndex()) {
      inner.innerHTML =
        '<span class="stamp">nog niet aan de beurt</span>' +
        "<h2>Geduld.</h2>" +
        '<p class="notyet">De zegels gaan op volgorde open. Eerst nummer ' +
        (nextIndex() + 1) + ", dan pas deze.</p>" +
        '<button class="close" type="button">oké dan</button>';
    } else {
      inner.innerHTML =
        '<span class="stamp">' + s.when + "</span>" +
        "<h2>" + s.title + "</h2>" +
        "<p>" + s.teaser + "</p>" +
        '<form class="keypad"><input type="text" autocomplete="off" autocapitalize="characters" ' +
        'spellcheck="false" placeholder="code" aria-label="Code"><button type="submit">open</button></form>' +
        '<button class="close" type="button">nog niet</button>' +
        (admin ? '<div><button class="forceer" type="button">forceer open</button></div>' : "");

      function unlock() {
        if (open.indexOf(i) === -1) open.push(i);
        save(open);
        paint();
        show(i);
        inner.classList.remove("pop");
        void inner.offsetWidth;
        inner.classList.add("pop");
      }

      var forceBtn = inner.querySelector(".forceer");
      if (forceBtn) forceBtn.addEventListener("click", unlock);

      inner.querySelector(".keypad").addEventListener("submit", function (ev) {
        ev.preventDefault();
        var input = inner.querySelector(".keypad input");
        if (hash(input.value) === s.hash) { unlock(); return; }
        if (hash(input.value) === ADMIN_HASH) { setAdmin(); show(i); return; }
        var deny = inner.querySelector(".deny");
        if (!deny) {
          deny = document.createElement("p");
          deny.className = "deny";
          deny.setAttribute("role", "status");
          inner.querySelector(".keypad").after(deny);
        }
        deny.textContent = input.value.trim() ? "Nee. Nog niet." : "Er moet wel iets staan.";
        var pad = inner.querySelector(".keypad");
        pad.classList.remove("shake");
        void pad.offsetWidth;
        pad.classList.add("shake");
        input.select();
      });
    }

    inner.querySelector(".close").addEventListener("click", function () { note.close(); });
    if (!note.open) note.showModal();
  }

  note.addEventListener("click", function (ev) {
    if (ev.target === note) note.close();
  });

  /* ---------- the gate: sealed until Friday 11 September 2026 ---------- */

  var ADMIN_KEY = "zevenzegels.admin.v1";
  var ADMIN_HASH = 1838800238;
  var OPENS_AT = new Date(2026, 8, 11, 0, 0, 0); // 11 Sep 2026, local time
  var gate = document.getElementById("gate");
  var clock = document.getElementById("clock");
  var adminForm = document.getElementById("adminForm");
  var adminMsg = document.getElementById("adminMsg");
  var ticker = null;

  var planBtn = document.getElementById("planBtn");
  var planDlg = document.getElementById("planDlg");

  planBtn.addEventListener("click", function () {
    planDlg.showModal();
    planDlg.querySelector(".plan-body").scrollTop = 0;
  });
  document.getElementById("planClose").addEventListener("click", function () { planDlg.close(); });
  planDlg.addEventListener("click", function (ev) { if (ev.target === planDlg) planDlg.close(); });

  function setAdmin() {
    admin = true;
    try { localStorage.setItem(ADMIN_KEY, "1"); } catch (e) {}
    planBtn.hidden = false;
    lift();
    paint();
  }

  function unit(v, label) {
    return '<div><b>' + String(v).padStart(2, "0") + "</b><span>" + label + "</span></div>";
  }

  var hint = document.querySelector(".hint");

  function lift() {
    document.documentElement.classList.remove("presealed");
    document.body.classList.remove("sealed");
    gate.hidden = true;
    viewport.hidden = false;
    quicklist.hidden = false;
    hint.hidden = false;
    if (ticker) { clearInterval(ticker); ticker = null; }
    fit(window.innerWidth <= 700);
    intro();
  }

  /* ---------- the opening: the map arrives, then the pins drop in ---------- */

  var INTRO_KEY = "zevenzegels.intro.v1";

  function intro() {
    var seen = true;
    try { seen = localStorage.getItem(INTRO_KEY) === "1"; } catch (e) {}
    if (seen) return;
    try { localStorage.setItem(INTRO_KEY, "1"); } catch (e) {}

    world.classList.add("intro");
    SEALS.forEach(function (s, i) {
      s.el.style.setProperty("--d", (500 + i * 180) + "ms");
      s.el.classList.add("popin");
    });
    setTimeout(function () {
      world.classList.remove("intro");
      SEALS.forEach(function (s) { s.el.classList.remove("popin"); s.el.style.removeProperty("--d"); });
    }, 500 + SEALS.length * 180 + 700);
  }

  /* ---------- the moment before the map ---------- */

  var openBtn = document.getElementById("openBtn");
  var seq = document.getElementById("seq");

  var LINES = [
    "Eenendertig.",
    "De tas staat in de auto.",
    "De tent is geboekt, de tafel is gereserveerd.",
    "En er ligt een kaart met zeven plekken die je nog niet kent.",
    "Vanaf hier weet je niks meer vooraf."
  ];

  function armCeremony() {
    if (ticker) { clearInterval(ticker); ticker = null; }
    clock.hidden = true;
    adminForm.hidden = true;
    adminMsg.hidden = true;
    openBtn.hidden = false;
    gate.querySelector("h2").textContent = "Lisa, de kaart is open.";
    gate.querySelector(".why").textContent = "Eén druk en je weet waar we heen gaan.";
  }

  function runCeremony() {
    openBtn.hidden = true;
    gate.classList.add("shaking");
    gate.querySelector("h2").hidden = true;
    gate.querySelector(".why").hidden = true;
    seq.hidden = false;

    LINES.forEach(function (text, i) {
      setTimeout(function () {
        var p = document.createElement("p");
        if (i === LINES.length - 1) p.className = "last";
        p.textContent = text;
        seq.appendChild(p);
        // keep only the last two lines on screen so the card never grows out of view
        while (seq.children.length > 2) seq.removeChild(seq.firstChild);
      }, i * 1500);
    });

    var end = LINES.length * 1500;
    setTimeout(confetti, end + 200);
    setTimeout(function () { gate.classList.add("fading"); }, end + 900);
    setTimeout(function () { gate.classList.remove("fading"); lift(); }, end + 1500);
  }

  openBtn.addEventListener("click", runCeremony);

  // admin only: put the sealed card back so the opening can be watched again
  function replayOpening() {
    try { localStorage.removeItem(INTRO_KEY); } catch (e) {}
    seq.innerHTML = "";
    seq.hidden = true;
    gate.classList.remove("shaking", "fading");
    gate.querySelector("h2").hidden = false;
    gate.querySelector(".why").hidden = false;
    document.body.classList.add("sealed");
    gate.hidden = false;
    viewport.hidden = true;
    quicklist.hidden = true;
    hint.hidden = true;
    armCeremony();
    window.scrollTo(0, 0);
  }

  function tick() {
    var left = OPENS_AT - Date.now();
    if (left <= 0) { armCeremony(); return; }
    var s = Math.floor(left / 1000);
    var d = Math.floor(s / 86400);
    var h = Math.floor((s % 86400) / 3600);
    var m = Math.floor((s % 3600) / 60);
    clock.innerHTML =
      unit(d, d === 1 ? "dag" : "dagen") +
      unit(h, "uur") +
      unit(m, "min") +
      unit(s % 60, "sec");
  }

  adminForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var input = adminForm.querySelector("input");
    if (hash(input.value) === ADMIN_HASH) { setAdmin(); return; }
    adminMsg.textContent = input.value.trim()
      ? "nee. wachten."
      : "vrijdag 11 september · 00:00";
    adminForm.classList.remove("shake");
    void adminForm.offsetWidth;
    adminForm.classList.add("shake");
    input.select();
  });

  planBtn.hidden = !admin;

  var seenOpening = false;
  try { seenOpening = localStorage.getItem(INTRO_KEY) === "1"; } catch (e) {}

  if (admin || seenOpening) {
    lift();
  } else if (Date.now() >= OPENS_AT) {
    document.body.classList.add("sealed");
    gate.hidden = false;
    viewport.hidden = true;
    quicklist.hidden = true;
    hint.hidden = true;
    armCeremony();
  } else {
    document.body.classList.add("sealed");
    gate.hidden = false;
    viewport.hidden = true;
    quicklist.hidden = true;
    hint.hidden = true;
    tick();
    ticker = setInterval(tick, 1000);
  }

  document.getElementById("adminBtn").addEventListener("click", function () {
    if (admin) {
      inner.innerHTML =
        '<span class="stamp">admin</span><h2>Admin staat aan.</h2>' +
        '<p class="notyet">Je kan elk zegel in willekeurige volgorde openen, en er staat een ' +
        '"forceer open" knop in elk slot.</p>' +
        '<div><button class="forceer" id="testOpening" type="button">toon de opening</button></div>' +
        '<button class="close" type="button">sluiten</button>';
      inner.querySelector("#testOpening").addEventListener("click", function () {
        note.close();
        replayOpening();
      });
    } else {
      inner.innerHTML =
        '<span class="stamp">admin</span><h2>Admin</h2>' +
        '<p class="notyet">Met de adminkoode omzeil je de volgorde en de aftelklok.</p>' +
        '<form class="keypad"><input type="text" autocomplete="off" autocapitalize="characters" ' +
        'spellcheck="false" placeholder="code" aria-label="Adminkoode"><button type="submit">ok</button></form>' +
        '<button class="close" type="button">laat maar</button>';
      inner.querySelector(".keypad").addEventListener("submit", function (ev) {
        ev.preventDefault();
        var input = inner.querySelector(".keypad input");
        if (hash(input.value) === ADMIN_HASH) { setAdmin(); note.close(); return; }
        var pad = inner.querySelector(".keypad");
        pad.classList.remove("shake");
        void pad.offsetWidth;
        pad.classList.add("shake");
        input.select();
      });
    }
    inner.querySelector(".close").addEventListener("click", function () { note.close(); });
    if (!note.open) note.showModal();
  });

  document.getElementById("reset").addEventListener("click", function () {
    open = [];
    save(open);
    admin = false;
    try {
      localStorage.removeItem(ADMIN_KEY);
      localStorage.removeItem(INTRO_KEY);
    } catch (e) {}
    planBtn.hidden = true;
    paint();
    location.reload();
  });

  paint();
})();
</script>
